# ============================================================
# DVC Pipeline Definition
# ============================================================
# MLOps Concept: DVC (Data Version Control) creates reproducible
# ML pipelines where each stage is tracked with its inputs,
# outputs, and dependencies.
#
# Run the full pipeline: dvc repro
# View pipeline DAG:     dvc dag
# Compare metrics:       dvc metrics diff
# ============================================================

stages:
  # ── Stage 1: Data Ingestion ──────────────────────────────
  data_ingestion:
    cmd: python src/data_ingestion.py
    deps:
      - src/data_ingestion.py
      - configs/params.yaml
    outs:
      - data/raw/churn_data.csv
    params:
      - configs/params.yaml:
          - data.random_state
    desc: "Load or generate raw churn dataset and validate schema"

  # ── Stage 2: Feature Engineering ────────────────────────
  feature_engineering:
    cmd: python src/feature_engineering.py
    deps:
      - src/feature_engineering.py
      - src/data_ingestion.py
      - data/raw/churn_data.csv
      - configs/params.yaml
    outs:
      - data/processed/train.csv
      - data/processed/test.csv
      - data/processed/reference.csv
      - models/preprocessor.joblib
    params:
      - configs/params.yaml:
          - data.test_size
          - data.random_state
          - features.numerical_features
          - features.categorical_features
          - features.drop_columns
    desc: "Preprocess data, split train/test, fit and save preprocessor"

  # ── Stage 3: Model Training ──────────────────────────────
  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - src/feature_engineering.py
      - data/processed/train.csv
      - data/processed/test.csv
      - models/preprocessor.joblib
      - configs/params.yaml
    outs:
      - reports/confusion_matrix.png
      - reports/roc_curve.png
      - reports/feature_importance.png
      - reports/classification_report.txt
    metrics:
      - reports/metrics.json:
          cache: false
    params:
      - configs/params.yaml:
          - model.algorithm
          - model.random_forest
          - model.xgboost
          - model.logistic_regression
          - evaluation.min_accuracy_threshold
          - evaluation.min_f1_threshold
          - evaluation.min_roc_auc_threshold
    desc: "Train model with MLflow tracking and evaluate quality gate"

  # ── Stage 4: Drift Detection ─────────────────────────────
  drift_detection:
    cmd: python monitoring/drift_detection.py --no-simulate
    deps:
      - monitoring/drift_detection.py
      - data/processed/reference.csv
      - data/processed/test.csv
      - configs/params.yaml
    outs:
      - reports/:
          persist: true
    desc: "Run drift detection comparing reference vs production data"
