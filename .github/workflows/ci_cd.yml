# ============================================================
# GitHub Actions CI/CD Pipeline for MLOps Churn Prediction
# ============================================================
#
# MLOps Concept: CI/CD for ML is different from regular software CI/CD.
# It includes: data validation → model training → quality gate → deployment
#
# Pipeline Triggers:
#   - Push to main/develop branch
#   - Pull request to main
#   - Manual trigger (workflow_dispatch)
#   - Scheduled (weekly retraining)
#
# Pipeline Stages:
#   1. Code Quality (lint, format check)
#   2. Data Tests (schema, quality validation)
#   3. Model Tests (unit tests, quality gate)
#   4. Training Pipeline (full end-to-end)
#   5. Build & Push Docker Image
#   6. Deploy to Staging
# ============================================================

name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force model retraining'
        required: false
        default: 'false'
  schedule:
    # Weekly retraining every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

env:
  PYTHON_VERSION: "3.10"
  MLFLOW_TRACKING_URI: "sqlite:///mlflow.db"
  MODEL_NAME: "churn-classifier"

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1: Code Quality Checks
  # ──────────────────────────────────────────────────────────
  code-quality:
    name: "Code Quality"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install linting tools
        run: |
          pip install flake8 black isort
          
      - name: Check code formatting (black)
        run: |
          black --check --diff src/ api/ pipelines/ monitoring/ tests/
        continue-on-error: true  # Don't fail on formatting issues in demo

      - name: Check import ordering (isort)
        run: |
          isort --check-only --diff src/ api/ pipelines/ monitoring/ tests/
        continue-on-error: true

      - name: Lint with flake8
        run: |
          # Stop on syntax errors or undefined names
          flake8 src/ api/ pipelines/ monitoring/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warn on style issues
          flake8 src/ api/ pipelines/ monitoring/ --count --max-line-length=100 --statistics
        continue-on-error: true

  # ──────────────────────────────────────────────────────────
  # Job 2: Data & Unit Tests
  # ──────────────────────────────────────────────────────────
  test:
    name: "Tests"
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data tests
        run: |
          echo "Running data validation tests..."
          pytest tests/test_data.py -v --tb=short \
            --junitxml=reports/test_data_results.xml \
            -m "not slow"
        
      - name: Run model tests
        run: |
          echo "Running model tests..."
          pytest tests/test_model.py -v --tb=short \
            --junitxml=reports/test_model_results.xml

      - name: Run API schema tests
        run: |
          echo "Running API tests..."
          pytest tests/test_api.py::TestInputSchema -v --tb=short \
            --junitxml=reports/test_api_results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/*_results.xml

  # ──────────────────────────────────────────────────────────
  # Job 3: Training Pipeline + Quality Gate
  # ──────────────────────────────────────────────────────────
  train-and-evaluate:
    name: "Train & Evaluate"
    runs-on: ubuntu-latest
    needs: test
    if: |
      github.ref == 'refs/heads/main' || 
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training pipeline
        run: |
          echo "Starting MLOps training pipeline..."
          python pipelines/training_pipeline.py --config configs/params.yaml
        env:
          MLFLOW_TRACKING_URI: ${{ env.MLFLOW_TRACKING_URI }}

      - name: Check quality gate
        run: |
          echo "Checking model quality gate..."
          python -c "
          import json, sys, glob
          reports = glob.glob('reports/pipeline_run_*.json')
          if not reports:
              print('No pipeline report found!')
              sys.exit(1)
          latest = sorted(reports)[-1]
          with open(latest) as f:
              report = json.load(f)
          print('Pipeline ID:', report['pipeline_id'])
          print('Success:', report['success'])
          print('Quality Gate:', report.get('quality_gate_passed', False))
          if report.get('metrics'):
              print('Metrics:', report['metrics'])
          if not report['success']:
              print('Pipeline FAILED!')
              sys.exit(1)
          if not report.get('quality_gate_passed', False):
              print('Quality gate FAILED! Model does not meet minimum thresholds.')
              sys.exit(1)
          print('Quality gate PASSED! Model is ready for deployment.')
          "

      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-artifacts
          path: |
            mlruns/
            models/
            reports/

      - name: Upload model metrics
        uses: actions/upload-artifact@v4
        with:
          name: model-metrics
          path: reports/metrics.json

  # ──────────────────────────────────────────────────────────
  # Job 4: Run Drift Detection
  # ──────────────────────────────────────────────────────────
  drift-detection:
    name: "Drift Detection"
    runs-on: ubuntu-latest
    needs: train-and-evaluate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: mlflow-artifacts

      - name: Run drift detection
        run: |
          echo "Running drift detection..."
          python monitoring/drift_detection.py \
            --config configs/params.yaml \
            --drift-factor 0.0 \
            --no-simulate
        continue-on-error: true

      - name: Upload drift reports
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: reports/drift_report_*

  # ──────────────────────────────────────────────────────────
  # Job 5: Build Docker Image
  # ──────────────────────────────────────────────────────────
  build-docker:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    needs: train-and-evaluate
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build -t churn-prediction-api:${{ github.sha }} .
          docker build -t churn-prediction-api:latest .
          echo "Docker image built successfully"

      - name: Test Docker image health
        run: |
          # Start container
          docker run -d --name test-api \
            -p 8000:8000 \
            churn-prediction-api:latest
          
          # Wait for startup
          sleep 15
          
          # Health check (model won't be loaded but API should start)
          curl -f http://localhost:8000/health || exit 1
          echo "Docker health check passed!"
          
          # Cleanup
          docker stop test-api
          docker rm test-api

      # Uncomment to push to Docker Hub or ECR:
      # - name: Login to Docker Hub
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKER_USERNAME }}
      #     password: ${{ secrets.DOCKER_PASSWORD }}
      #
      # - name: Push to Docker Hub
      #   run: |
      #     docker push churn-prediction-api:${{ github.sha }}
      #     docker push churn-prediction-api:latest

  # ──────────────────────────────────────────────────────────
  # Job 6: Deploy to Staging (manual approval in production)
  # ──────────────────────────────────────────────────────────
  deploy-staging:
    name: "Deploy to Staging"
    runs-on: ubuntu-latest
    needs: [build-docker, drift-detection]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          echo "In production, this would:"
          echo "  1. Push Docker image to registry"
          echo "  2. Update Kubernetes deployment"
          echo "  3. Run smoke tests"
          echo "  4. Notify team via Slack/email"
          echo ""
          echo "Deployment simulation complete!"

      - name: Notify deployment
        run: |
          echo "Deployment notification would be sent to:"
          echo "  - Slack #ml-deployments channel"
          echo "  - Email: ml-team@company.com"
          echo "  - PagerDuty (if critical)"
